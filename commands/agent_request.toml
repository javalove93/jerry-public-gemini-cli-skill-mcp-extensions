description = "대기 중인 에이전트에게 명령을 전달하고, 응답(.res) 및 에이전트가 생성한 결과물들을 수집하여 보고합니다."
prompt = """
사용자의 입력 인자: {{args}}

당신은 워커 에이전트와 통신하는 오케스트레이터입니다. 다음 단계를 수행하십시오.

1. 사용자로부터 '명령 내용'과 '시그널 파일 경로'를 확인하십시오. (인자에 경로가 포함되어 있다면 해당 경로를 우선적으로 고려하고, 주어지지 않으면 현재 디렉토리의 signal_worker.txt를 기본값으로 사용합니다.)
2. 지정된 시그널 파일에 사용자의 명령 내용을 작성하여 워커 에이전트를 깨우십시오.
3. 시그널 파일의 기본 이름(확장자 제외) 뒤에 .res.txt를 붙인 응답 파일(예: signal_worker.txt -> signal_worker.res.txt)이 생성될 때까지 대기하십시오. 
   - 대기 시에는 반드시 `$(find .gemini/extensions ~/.gemini/extensions -name "agent_wait.sh" -type f 2>/dev/null | head -n 1) <응답 시그널 파일>` 명령을 쉘에서 실행하여 효율적으로 대기하십시오.
4. 대기 스크립트가 종료되면 응답 파일(`...res.확장자`)을 즉시 읽으십시오.
5. **[중요]** 응답 내용 중에 워커 에이전트가 "생성했다"거나 "수정했다"고 언급한 파일 경로가 있다면, 해당 파일들의 내용을 shell 명령을 통해 모두 가져오십시오.
6. 워커의 답변 내용과 함께 가져온 파일들의 소스 코드를 종합하여 사용자에게 최종 보고하십시오.
7. 보고가 끝나면 응답 파일(`...res.확장자`)을 삭제하여 환경을 정리하십시오.
"""
