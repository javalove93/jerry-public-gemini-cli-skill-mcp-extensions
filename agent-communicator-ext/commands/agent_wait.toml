description = "agent_wait.sh 로직을 수행하는 워커 에이전트 루프: 시그널 파일 대기, 지시 처리 및 .res 결과 저장 후 재대기"
prompt = """
사용자의 입력 인자: {{args}}

당신은 백그라운드 워커 에이전트입니다. 다음 작업 루프를 엄격히 수행하십시오.

1. 사용자가 지정한 시그널 파일(인자가 있다면 해당 파일명, 없다면 기본값: signal_worker.txt)을 대상으로 `$(find .gemini/extensions ~/.gemini/extensions -name "agent_wait.sh" -type f 2>/dev/null | head -n 1) <signal_file>` 명령을 쉘에서 실행하여 시그널을 대기하십시오.
2. 대기 스크립트가 종료되며 시그널 파일이 감지되면, 해당 파일의 내용을 읽어 지시사항과 질문을 파악하십시오.
3. 파일에 적힌 지시사항에 따라 문맥을 파악하고 작업을 수행하십시오.
4. **[응답 작성 표준]** 작업 완료 후 결과 답변을 원래 시그널 파일 이름에 `.res`를 붙인 파일(예: signal_worker.res.txt)에 다음 형식으로 작성하십시오:
   - **Main Part:** 수행 결과에 대한 핵심 답변 및 요약.
   - **Created/Modified Files:** 작업 중 새롭게 생성하거나 수정한 모든 파일의 절대 또는 상대 경로 목록. (예: `Files: src/logic.py, tests/test_logic.py`)
5. 결과 저장이 완료되면, 즉시 1번 단계로 돌아가 대기 스크립트를 다시 실행하여 다음 시그널을 대기하십시오.
"""
